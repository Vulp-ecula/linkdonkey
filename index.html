<meta name="apple-mobile-web-app-title" content="LinkDonkey">
<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#E6EBE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172120" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EBE4; --card:#F5F7F2; --ink:#1F2C2B; --ink-2:#48595A; --line:rgba(31,44,43,.2);
  --hay:#C9982A; --moss:#4E7043; --rope:#A63D2C; --rope-soft:#F0D6CF; --focus:#2F5FA8;
  --on-hay:#1F2C2B; --on-moss:#FFFFFF;
  --display:'Bricolage Grotesque','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --text:'Literata',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#172120; --card:#20302D; --ink:#E4EBE3; --ink-2:#A9B8B3; --line:rgba(228,235,227,.22);
    --hay:#D8AD3A; --moss:#7FA56F; --rope:#E58B78; --rope-soft:#4A2A25; --focus:#8CB4F0;
    --on-hay:#1B2321; --on-moss:#12200D;
  }
}
:root[data-theme="dark"]{
  --paper:#172120; --card:#20302D; --ink:#E4EBE3; --ink-2:#A9B8B3; --line:rgba(228,235,227,.22);
  --hay:#D8AD3A; --moss:#7FA56F; --rope:#E58B78; --rope-soft:#4A2A25; --focus:#8CB4F0;
  --on-hay:#1B2321; --on-moss:#12200D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:1.0625rem;line-height:1.55}
.wrap{max-width:38rem;margin:0 auto;padding:1.1rem 1.1rem 4rem}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:.75rem}
.mark{width:68px;height:68px;border-radius:16px;background:#fff;border:1.5px solid var(--line);display:block}
.brand{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em;margin:0}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:.1rem;max-width:8.5rem}
.sync{font-size:.8rem;color:var(--ink-2);margin:0;text-align:right}
@media (min-width:34rem){.mark{width:96px;height:96px;border-radius:22px}.brand{font-size:2.2rem}.hr{max-width:none}}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem;margin:1.1rem 0 .4rem}
@media (min-width:34rem){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left;color:var(--ink)}
.stat svg{width:30px;height:30px;flex:none}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;letter-spacing:-.02em}
.stat span{display:block;font-size:.82rem;line-height:1.2;color:var(--ink-2);margin-top:.15rem}
@media (prefers-reduced-motion: no-preference){.stat{transition:transform .15s ease,border-color .15s ease}.stat:hover{transform:translateY(-2px);border-color:var(--hay)}.stat:active{transform:translateY(0)}}
.tally{margin:.2rem 0 0;color:var(--ink-2);font-size:.95rem}

nav.tabs{display:flex;flex-wrap:wrap;gap:.25rem 1.3rem;margin:1.2rem 0 1.4rem;border-bottom:1.5px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:4px solid transparent;padding:.7rem 0 .55rem;font-family:var(--display);font-weight:600;font-size:1.02rem;color:var(--ink-2);cursor:pointer;min-height:44px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--hay)}

h2.sec{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:1.6rem 0 .7rem;letter-spacing:-.01em}
.card{background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--hay);border-radius:6px 16px 16px 6px;padding:1rem 1.1rem 1.05rem;margin:0 0 1rem}
.card.recipe{border-left-color:var(--moss)}
.card.recall{border-left-color:var(--ink-2);border-left-style:dotted}
.card h3{font-family:var(--display);font-weight:650;font-size:1.18rem;line-height:1.25;margin:0 0 .3rem;overflow-wrap:anywhere}
.job{margin:0 0 .25rem}
.shot{display:block;max-width:100%;max-height:60vh;border-radius:8px;margin:.5rem 0;background:var(--line)}
.summ{margin:.35rem 0;font-style:italic}
.cs{min-height:36px;padding:.2rem .75rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;font:inherit;font-weight:600;margin:.15rem .35rem .15rem 0;cursor:pointer;color:inherit}
.cs.on{border-color:var(--ink);background:var(--card)}
select{font:inherit;padding:.5rem .6rem;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.vh{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.ngrid{column-gap:.7rem;column-count:1;margin:.3rem 0 .6rem}
@media (min-width:34rem){.ngrid{column-count:2}}
.nhead{margin:.9rem 0 .2rem;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ncard{display:block;break-inside:avoid;margin:0 0 .7rem;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:14px;background-color:var(--card);cursor:pointer}
.ncard h3{margin:.1rem 0 .3rem;font-size:1.05rem}
.ncard .meta{margin:.3rem 0 0}
.npin{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:.15rem}
.ntext{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden;margin:.2rem 0}
.nlabs{margin:.4rem 0 0}
.nlab{display:inline-block;margin:0 .3rem .25rem 0;padding:.05rem .55rem;border:1.5px solid var(--line);border-radius:999px;font-size:.8rem}
.nrow{display:flex;align-items:center;gap:.5rem;margin:.15rem 0}
.ntick{flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;background:transparent;color:var(--on-moss,#12200D);font-weight:800;line-height:1;cursor:pointer;padding:0}
.ntick[aria-checked="true"]{background:var(--moss);border-color:var(--moss)}
.nt{overflow-wrap:anywhere}.nt.done,.nitem.done{text-decoration:line-through;color:var(--ink-2)}
.neditor{border:1.5px solid var(--line);border-radius:14px;padding:.8rem .9rem;background-color:var(--card)}
.neditor input.ntitle{width:100%;font-weight:700;font-size:1.15rem;border:0;border-bottom:1.5px solid var(--line);background:transparent;margin:0 0 .5rem;padding:.3rem 0}
.neditor textarea{width:100%;min-height:9rem;border:0;background:transparent;resize:vertical;padding:.2rem 0}
.neditor input.nitem{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.3rem 0}
.ndots{display:flex;flex-wrap:wrap;gap:.45rem;margin:.2rem 0 .5rem}
.ndot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.ndot.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.nc1{background-image:linear-gradient(rgba(229,139,120,.32),rgba(229,139,120,.32))}
.nc2{background-image:linear-gradient(rgba(233,162,70,.32),rgba(233,162,70,.32))}
.nc3{background-image:linear-gradient(rgba(222,190,60,.34),rgba(222,190,60,.34))}
.nc4{background-image:linear-gradient(rgba(127,165,111,.34),rgba(127,165,111,.34))}
.nc5{background-image:linear-gradient(rgba(70,170,160,.32),rgba(70,170,160,.32))}
.nc6{background-image:linear-gradient(rgba(100,150,225,.32),rgba(100,150,225,.32))}
.nc7{background-image:linear-gradient(rgba(160,120,215,.32),rgba(160,120,215,.32))}
.nc8{background-image:linear-gradient(rgba(225,120,175,.32),rgba(225,120,175,.32))}
.qopt{display:block;width:100%;text-align:left;margin:.4rem 0;padding:.7rem .9rem;border:2px solid var(--line);border-radius:10px;background:transparent;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.qopt.good{border-color:#2e7d4f;background:rgba(46,125,79,.18)}
.qopt.bad{border-color:#c0452f;background:rgba(192,69,47,.16)}
.qopt[aria-disabled="true"]{cursor:default}
.orig{margin:1rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line);border-radius:10px}
.orig .notetext{display:block;overflow:visible}
.notetext{white-space:pre-wrap;overflow-wrap:anywhere;margin:.4rem 0}
.card.lotd{border-left-color:var(--ink-2)}
.row .notetext{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.row .shot{max-height:14rem}
.lotd-tag{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin:0 0 .3rem;color:var(--ink-2)}
.meta{margin:0 0 .2rem;font-size:.88rem;color:var(--ink-2);overflow-wrap:anywhere}
.stale{margin:.6rem 0 0;padding:.4rem .65rem;border-radius:6px;background:var(--rope-soft);font-size:.92rem}
.ask{margin:.8rem 0 .4rem;font-weight:600}
.note{margin:.6rem 0 0;padding:.1rem 0 .1rem .9rem;border-left:3px solid var(--hay);font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;margin-top:.9rem}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.5rem 1.05rem;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-family:var(--display);font-weight:600;font-size:.98rem;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--hay);border-color:var(--hay);color:var(--on-hay)}
.btn.moss{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.btn.danger{border-color:var(--rope);color:var(--rope)}
.btn.danger.solid{background:var(--rope);color:var(--paper)}
.txt{background:none;border:0;padding:.5rem .3rem;min-height:44px;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2);cursor:pointer}

label{display:block;font-weight:600;margin:1rem 0 .3rem}
.hint{font-weight:400;color:var(--ink-2);font-size:.88rem;display:block}
input[type=url],input[type=text],input[type=search],textarea{width:100%;background:var(--card);border:1.5px solid var(--ink-2);border-radius:8px;padding:.6rem .75rem;min-height:44px}
textarea{resize:vertical}
.seg{display:flex;gap:.5rem;margin:.2rem 0 0}
.seg button{flex:1;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-family:var(--display);font-weight:600;cursor:pointer}
.seg button[aria-checked="true"]{border-color:var(--ink);background:var(--card)}
.err{color:var(--rope);margin:.4rem 0 0;font-size:.92rem}
.ok{margin:.9rem 0 0;padding:.5rem .75rem;border-radius:6px;background:var(--card);border:1.5px solid var(--moss)}
.empty{margin:1.4rem 0;color:var(--ink-2)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0 1rem}
.chips button{min-height:40px;padding:.3rem .9rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-family:var(--display);font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.row{padding:.85rem 0;border-bottom:1.5px solid var(--line)}
.row h3{font-family:var(--display);font-weight:650;font-size:1.05rem;margin:0 0 .15rem;overflow-wrap:anywhere}
.row a{color:inherit}
.row .note{margin-top:.4rem}
ol.steps{padding-left:1.2rem;margin:.4rem 0 1rem}
ol.steps li{margin:.35rem 0}
input[type=file]{width:100%;min-height:44px;padding:.5rem 0}
summary.sum{font-family:var(--display);font-weight:650;font-size:1.05rem;cursor:pointer;padding:.7rem 0;min-height:44px}
details{border-bottom:1.5px solid var(--line);padding-bottom:.6rem}
details[open] summary.sum{margin-bottom:.2rem}
</style>
</head>

  sb=window.supabase.createClient(SB_URL,SB_KEY);
  var s=null;try{var r=await sb.auth.getSession();s=r.data&&r.data.session;}catch(e){}
  if(!s){ui.auth='out';render();return;}

}
function startSync(id){
  /* local cache belongs to one account: drop it if a different account signs in */
  var prev=null;try{prev=localStorage.getItem(UID_KEY);localStorage.setItem(UID_KEY,id);}catch(e){}
  if(prev&&prev!==id){state={v:1,rev:0,items:[]};saveLocal();stage={v:1,folders:[],items:[],binned:[],dupes:0,kept:0};saveStageLocal();}
  sbUser=id;ui.auth='in';ui.authErr='';
  remote={set:async function(doc){
    var r=await sb.from('ld_state').upsert({user_id:sbUser,doc:doc,rev:doc.rev||0,updated_at:new Date().toISOString()});
    if(r.error)throw r.error;
  }};

}
async function pull(){
  if(!remote)return;
  var r;try{r=await sb.from('ld_state').select('doc').eq('user_id',sbUser).maybeSingle();}catch(e){r={error:e};}
  if(r.error){ui.sync='error';paintStatus();return;}
  var d=r.data&&r.data.doc;

    var rr=d.rev||0;
    if(rr>state.rev){state=clone(d);saveLocal();checkSize();if(reconcileStage())saveStageLocal();render();}

  }else if(state.items.length){pushRemote();return;}
  ui.sync='synced';paintStatus();
}

function eligible(){var t=now();return openItems().filter(function(i){return !i.snoozeUntil||i.snoozeUntil<=t;});}
function hashId(x){var h=2166136261;x=String(x);for(var i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
/* The three slots: anything mid-finish or pushed forward first, then a mix: the oldest, the newest, and one from the middle.

function carried(){
  var pool=eligible(),out=[];
  function take(it){out.push(it);pool=pool.filter(function(x){return x!==it;});}

  var inWeek={},t=now();
  carried().forEach(function(i){inWeek[i.id]=1;});
  return state.items.filter(function(i){
    if(skip.indexOf(i.id)>-1)return false;
    if(i.status==='open')return !inWeek[i.id]&&(!i.snoozeUntil||i.snoozeUntil<=t);
    return i.status==='keeper'||i.status==='done'||i.status==='forever';
  });
}
function lotdPick(skip){
  var old=function(i){return now()-lastSeen(i)>=3*DAY;};
  var pool=lotdPool(skip||[]);
  /* if anything old exists, only old things qualify; a library with nothing old falls back to whatever is there */
  if(lotdPool([]).some(old))pool=pool.filter(old);
  if(!pool.length)return null;
  var w=pool.map(function(i){return Math.max(1,Math.sqrt((now()-lastSeen(i))/DAY));});
  var r=Math.random()*w.reduce(function(a,b){return a+b;},0);

/* ---------- quiz: questions are written once by Claude from the saved content, stored on the item, and replayed free ---------- */
function cleanQz(z){
  if(!z||typeof z.question!=='string'||!Array.isArray(z.options)||z.options.length!==4||typeof z.answer!=='number'||z.answer<0||z.answer>3)return null;
  return {q:z.question,o:z.options.map(String),a:z.answer,e:String(z.explanation||'')};
}
function validQz(q){return !!(q&&typeof q.q==='string'&&Array.isArray(q.o)&&q.o.length===4&&typeof q.a==='number'&&q.a>=0&&q.a<4);}
function needsQuiz(i){
  if(i.qz||i.qzNo)return false;
  if(i.status!=='open'&&i.status!=='forever'&&i.status!=='keeper'&&i.status!=='done')return false;
  return i.type==='note'?!!i.text:i.type==='shot'?!!i.img:/^https?:\/\//i.test(i.url||'');
}
function quizPool(){return state.items.filter(function(i){return i.status!=='binned'&&validQz(i.qz);});}
function quizStats(){var a=0,c=0;state.items.forEach(function(i){a+=i.qn||0;c+=i.qc||0;});return {asked:a,right:c};}
/* never-asked first, then the ones you missed, then the ones not asked for longest; a little randomness so it is not always the same five */
function quizPick(n){
  var t=now();
  return quizPool().map(function(i){
    var asked=i.qn||0,missed=asked-(i.qc||0),days=Math.min((t-(i.qlast||0))/DAY,60);
    return {id:i.id,w:((asked===0?3:1)+missed*2+days/20)*(0.6+Math.random()*0.8)};
  }).sort(function(a,b){return b.w-a.w;}).slice(0,n).map(function(x){return x.id;});
}
function shuffled(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1)),t=r[i];r[i]=r[k];r[k]=t;}return r;}
function quizOriginal(it){
  var h='<div class="orig"><p class="meta">The original:</p><h3>'+esc(it.title)+'</h3>';
  if(it.type==='note')h+='<p class="notetext">'+esc(it.text)+'</p><div class="actions">'+shareBtn(it)+'</div>';
  else if(it.type==='shot'&&it.img)h+='<p class="meta"><a data-imglink="'+esc(it.img)+'" target="_blank" rel="noopener noreferrer">Open the screenshot full size</a></p><div class="actions">'+shareBtn(it)+'</div>';
  else h+='<div class="actions"><a class="btn primary" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">Open the page</a>'+shareBtn(it)+'</div>';
  return h+'</div>';
}
function quizHome(){

    else{
      if(missing)h+='<p class="meta">'+missing+' saved item'+(missing===1?' has':'s have')+' no question yet. Each one is written by Claude from the saved content and uses one of your monthly summaries. It does 25 at a time.</p><div class="actions"><button class="btn" data-a="quiz-make">Make questions</button></div>';
      else if(!pool.length)h+='<p class="meta">Nothing to ask about yet. Save a few links, notes or screenshots and questions appear here.</p>';
      if(ui.sortMsg)h+='<p class="ok" role="status">'+esc(ui.sortMsg)+'</p>';

function quizQuestion(){
  var z=ui.quiz;
  while(z.i<z.ids.length){var c=find(z.ids[z.i]);if(c&&validQz(c.qz))break;z.i++;}
  if(z.i>=z.ids.length){z.done=true;return quizDone();}
  var it=find(z.ids[z.i]),q=it.qz;
  if(!z.order)z.order=shuffled([0,1,2,3]);
  var answered=z.picked!=null,h='<h2 class="sec" style="margin-top:.2rem">Question '+(z.i+1)+' of '+z.ids.length+'</h2><p class="meta">'+esc(kindLabel(it))+', saved '+ago(it.created)+'. Score so far: '+z.score+'.</p>';
  if(it.type==='shot')h+=itemBody(it);
  else if(it.type!=='note'||(it.title&&it.title!==firstLine(it.text)))h+='<p class="meta">About: <strong>'+esc(it.title)+'</strong></p>';
  h+='<h3>'+esc(q.q)+'</h3>';
  h+=z.order.map(function(idx,k){
    var cls='qopt',mark='';
    if(answered){if(idx===q.a){cls+=' good';mark='\u2713 ';}else if(k===z.picked){cls+=' bad';mark='\u2717 ';}}
    return '<button class="'+cls+'" data-a="quiz-pick" data-k="'+k+'"'+(answered?' aria-disabled="true"':'')+'>'+mark+esc(q.o[idx])+'</button>';
  }).join('');
  if(answered){
    var right=z.order[z.picked]===q.a;
    h+='<p class="'+(right?'ok':'err')+'" role="status">'+(right?'Right.':'Not quite. The answer is: '+esc(q.o[q.a])+'.')+'</p>'+(q.e?'<p>'+esc(q.e)+'</p>':'')+quizAfter(it)+
      '<div class="actions"><button class="btn primary" data-a="quiz-next">'+(z.i+1>=z.ids.length?'See my score':'Next question')+'</button></div>';
  }
  return h+'<div class="actions">'+(answered?'':'<button class="txt" data-a="quiz-bad">This question does not make sense</button>')+'<button class="txt" data-a="quiz-quit">Stop the quiz</button></div>';
}
function quizDone(){
  var z=ui.quiz,h='<h2 class="sec" style="margin-top:.2rem">Your score</h2><p><strong>'+z.score+' of '+z.results.length+'</strong> right.</p>';
  h+=z.results.map(function(r){
    var it=find(r.id);if(!it)return '';
    return '<div class="row"><h3>'+(r.correct?'\u2713 ':'\u2717 ')+esc(it.qz?it.qz.q:it.title)+'</h3>'+(it.qz&&!r.correct?'<p class="meta">Answer: '+esc(it.qz.o[it.qz.a])+'</p>':'')+
      '<p class="meta">'+esc(it.title)+'</p>'+(!isText(it)?'<div class="actions" style="margin-top:.3rem"><a class="txt" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">Open the page</a></div>':'')+'</div>';
  }).join('');
  return h+'<div class="actions"><button class="btn primary" data-a="quiz-start" data-n="5">Another quiz</button><button class="txt" data-a="quiz-quit">Back to Quiz</button></div>';
}
/* after answering: the same options as This week (categories, Open it, Keep, Bin, Keep forever, Share) for items still waiting; categories and Share for the rest */
function quizAfter(it){
  var id=esc(it.id),parked=it.snoozeUntil&&it.snoozeUntil>now(),h='';
  if(it.status==='open'&&!parked){
    h+=cardOpen(it,{noBody:it.type==='shot'});
    if(it.type==='shot'&&it.img)h+='<p class="meta"><a data-imglink="'+esc(it.img)+'" target="_blank" rel="noopener noreferrer">Open the screenshot full size</a></p>';
    return h;
  }
  if(it.status==='binned')h+='<p class="ok" role="status">Binned. You can bring it back from the Archive tab.</p>';
  else if(parked)h+='<p class="ok" role="status">Kept for later. It comes back on '+esc(new Date(it.snoozeUntil).toLocaleDateString())+'.</p>';
  h+=quizOriginal(it)+catBlock(it);
  if(it.status==='forever')h+='<div class="actions"><button class="txt" data-a="unforever" data-id="'+id+'">Take off the shelf</button></div>';
  return h;
}
function viewQuiz(){

/* ---------- sharing (the phone's share sheet, which includes WhatsApp; WhatsApp Web or a saved picture on a computer) ---------- */
function shareBtn(it){return '<button class="txt" data-a="share" data-id="'+esc(it.id)+'">Share</button>';}
async function shotBlob(path){
  if(imgCache[path]){try{var r=await fetch(imgCache[path]);return await r.blob();}catch(e){}}
  return null;
}
async function shareItem(it){
  ui.shareMsg='';
  var title=it.title||'LinkDonkey';
  if(it.type==='shot'){
    var b=await shotBlob(it.img);
    if(!b){
      /* the browser only allows sharing right after a tap, so fetch the picture now and ask for another tap */
      if(sb&&it.img){try{var dl=await sb.storage.from('shots').download(it.img);if(dl&&dl.data)imgCache[it.img]=URL.createObjectURL(dl.data);}catch(e){}}
      ui.shareMsg=imgCache[it.img]?'The picture is ready. Tap Share again.':'The picture could not be loaded. Check your connection.';render();return;
    }
    var file=new File([b],'linkdonkey-screenshot.jpg',{type:'image/jpeg'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return;}catch(e){if(e&&e.name==='AbortError')return;}
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='linkdonkey-screenshot.jpg';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1000);
    ui.shareMsg='This device cannot send pictures to WhatsApp directly, so the picture was saved. Attach it in WhatsApp.';render();return;
  }
  var text=it.type==='note'?it.text:title,url=it.type==='note'?'':it.url;
  if(navigator.share){
    try{await navigator.share(url?{title:title,text:text,url:url}:{title:title,text:text});return;}catch(e){if(e&&e.name==='AbortError')return;}
  }
  window.open('https://wa.me/?text='+encodeURIComponent(text+(url?'\n'+url:'')),'_blank','noopener');
}

    var id='k'+(okc?cr.toString(36):'0')+'-'+hash36(title+'\n'+text+'\n'+(list?list.map(function(r){return r.t;}).join('|'):''));

    if(list&&list.length){it.list=list;n.lists++;}

function restoreBackup(text){
  var d;try{d=JSON.parse(text);}catch(e){return 'That file could not be read. Nothing was changed.';}
  if(!d||d.app!=='linkdonkey'||!Array.isArray(d.items))return 'That does not look like a LinkDonkey backup. Nothing was changed.';
  var OK={open:1,done:1,binned:1,keeper:1,forever:1,notebook:1},have={},add=0,skip=0,sa=0;
  state.items.forEach(function(i){have[i.id]=1;});
  d.items.forEach(function(i){
    var good=i&&typeof i==='object'&&i.id&&OK[i.status]&&(!i.url||/^https?:\/\//i.test(i.url));
    if(!good||have[i.id]){skip++;return;}
    state.items.push(i);have[i.id]=1;add++;
  });
  if(d.stage&&Array.isArray(d.stage.items)){
    var urls={},ids={};
    state.items.forEach(function(i){if(i.url)urls[norm(i.url)]=1;});
    stage.items.concat(stage.binned).forEach(function(i){ids[i.id]=1;});
    d.stage.items.forEach(function(i){
      if(!i||!i.id||ids[i.id]||!/^https?:\/\//i.test(i.u||'')||urls[norm(i.u)])return;
      var nm=cleanFolder((d.stage.folders||[])[i.f]),fi=stage.folders.indexOf(nm);
      if(fi<0){stage.folders.push(nm);fi=stage.folders.length-1;}
      i.f=fi;stage.items.push(i);ids[i.id]=1;sa++;
    });
    if(sa){normFolders();sortStage();saveStage();}
  }
  if(add)commit();
  return 'Restored '+add+' item'+(add===1?'':'s')+(sa?' and '+sa+' sorting-list link'+(sa===1?'':'s'):'')+'. '+skip+' skipped (already here, or not readable).';
}

var STEPS_HTML='<ol class="steps"><li>In Chrome, press Ctrl+Shift+O (Cmd+Option+B on a Mac) to open the bookmark manager.</li><li>Click the three dots at the top right of that page, then Export bookmarks.</li><li>Save the file, then choose it below.</li></ol>';
function loadStage(){
  try{var r=localStorage.getItem(SK);if(r){var x=JSON.parse(r);if(x&&Array.isArray(x.items)){stage=x;stage.folders=stage.folders||[];stage.binned=stage.binned||[];stage.kept=stage.kept||0;stage.dupes=stage.dupes||0;if(normFolders())saveStageLocal();}}}catch(e){}
}
function saveStageLocal(){try{localStorage.setItem(SK,JSON.stringify(stage));}catch(e){ui.imp='This device could not store the list. Try a smaller file.';}}
function saveStage(){stage.rev=now();saveStageLocal();pushStage();}
/* ---------- the sorting list syncs through its own table (ld_stage), last write wins ---------- */
var stageTimer=null,stageOff=false;
function pushStage(){if(!sb||!sbUser||stageOff)return;clearTimeout(stageTimer);stageTimer=setTimeout(doPushStage,800);}
async function doPushStage(){
  if(!sb||!sbUser||stageOff)return;
  clearTimeout(stageTimer);stageTimer=null;
  try{
    var r=await sb.from('ld_stage').upsert({user_id:sbUser,doc:stage,rev:stage.rev||0,updated_at:new Date().toISOString()});
    if(r.error)throw r.error;
    if(ui.stageErr){ui.stageErr=false;if(ui.tab==='import')render();}
  }catch(e){
    if(e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache/i.test(e.message||''))){stageOff=true;return;}
    ui.stageErr=true;if(ui.tab==='import')render();
  }
}
function reconcileStage(){
  var have={};state.items.forEach(function(i){if(i.url)have[norm(i.url)]=1;});
  var n=stage.items.length;
  stage.items=stage.items.filter(function(i){return !have[norm(i.u)];});
  return n!==stage.items.length;
}
async function pullStage(){
  if(!sb||!sbUser||stageOff)return;
  var r;try{r=await sb.from('ld_stage').select('doc').eq('user_id',sbUser).maybeSingle();}catch(e){return;}
  if(r.error){if(r.error.code==='42P01'||r.error.code==='PGRST205'||/does not exist|schema cache/i.test(r.error.message||''))stageOff=true;return;}
  var d=r.data&&r.data.doc;
  if(d&&Array.isArray(d.items)){
    var rr=d.rev||0;
    if(rr>(stage.rev||0)){
      stage={v:1,folders:d.folders||[],items:d.items,binned:d.binned||[],dupes:d.dupes||0,kept:d.kept||0,rev:rr};normFolders();
      reconcileStage();saveStageLocal();
      ui.sf=null;render();
    }else if(rr<(stage.rev||0)){pushStage();}
  }else if(stage.items.length||stage.binned.length){
    if(!stage.rev){stage.rev=now();saveStageLocal();}
    pushStage();
  }
}
function pullAll(){pull();pullStage();}
function sortStage(){stage.items.sort(function(a,b){return (a.d||9e9)-(b.d||9e9);});}
function norm(u){
  try{
    var x=new URL(u);x.hash='';
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid'].forEach(function(k){x.searchParams.delete(k);});
    return x.protocol+'//'+x.host.toLowerCase().replace(/^www\./,'')+x.pathname.replace(/\/+$/,'')+x.search;
  }catch(e){return u;}
}
function parseBookmarks(html){
  var doc=new DOMParser().parseFromString(html,'text/html'),out=[];
  doc.querySelectorAll('a[href]').forEach(function(a){
    var href=(a.getAttribute('href')||'').trim();
    if(!/^https?:\/\//i.test(href))return;
    var path=[],dl=a.closest('dl');
    while(dl){
      var dt=dl.parentElement;
      if(dt&&dt.tagName==='DT'){
        for(var c=dt.firstElementChild;c;c=c.nextElementSibling){if(c.tagName==='H3'){path.unshift(c.textContent.trim());break;}}
      }
      dl=(dt&&dt.parentElement)?dt.parentElement.closest('dl'):null;
    }
    out.push({u:href,t:(a.textContent||'').trim(),p:path.join(' / '),d:parseInt(a.getAttribute('add_date')||'0',10)||0});
  });
  return out;
}
function addRows(rows){
  var seen={};
  stage.items.forEach(function(i){seen[norm(i.u)]=1;});
  stage.binned.forEach(function(i){seen[norm(i.u)]=1;});
  state.items.forEach(function(i){seen[norm(i.url)]=1;});
  var added=0,dupes=0,over=0;
  rows.forEach(function(r){
    var k=norm(r.u);
    if(seen[k]){dupes++;return;}
    if(added>=CAP){over++;return;}
    seen[k]=1;
    var pn=cleanFolder(r.p||''),fi=stage.folders.indexOf(pn);
    if(fi<0){stage.folders.push(pn);fi=stage.folders.length-1;}
    stage.items.push({id:uid(),u:r.u,t:r.t||niceTitle(r.u),f:fi,d:r.d||0,h:r.h||host(r.u)});
    added++;
  });
  sortStage();stage.dupes+=dupes;
  ui.imp='Added '+added+'. Skipped '+dupes+' duplicates or links you already have.'+(over?' '+over+' more did not fit. Sweep these, then add the rest again.':'');
  ui.sf=null;ui.confirm=null;saveStage();render();
}
function importFile(file){
  file.text().then(function(txt){
    var rows=parseBookmarks(txt);
    if(!rows.length){ui.imp='No web bookmarks found. Use the file from Export bookmarks in Chrome.';return render();}
    addRows(rows);
  }).catch(function(){ui.imp='Could not read that file.';render();});
}
function parsePasted(txt){
  txt=(txt||'').trim();
  var rows=[];
  if(!txt)return rows;
  if(txt.charAt(0)==='{'){
    try{
      var o=JSON.parse(txt);
      (o.v||[]).forEach(function(v){
        if(!v||!/^https?:\/\//i.test(v.u||''))return;
        rows.push({u:v.u,t:(v.t||'').trim()||niceTitle(v.u),p:o.p||'YouTube',d:0,h:v.c?'YouTube - '+v.c:host(v.u)});
      });
    }catch(e){}
    return rows;
  }
  txt.split(/\r?\n/).forEach(function(line){
    line=line.trim();
    if(!line)return;
    var m=line.match(/https?:\/\/\S+/),id=line.match(/^([\w-]{11}),/);
    if(m){
      var u=m[0].replace(/[,;]+$/,''),t=line.replace(m[0],'').replace(/^[\s,;-]+|[\s,;-]+$/g,'');
      rows.push({u:u,t:t||niceTitle(u),p:'Pasted',d:0});
    }else if(id){
      rows.push({u:'https://www.youtube.com/watch?v='+id[1],t:'YouTube video '+id[1],p:'Watch later (Takeout)',d:0,h:'youtube.com'});
    }
  });
  return rows;
}
function matchG(it,g){
  if(!g)return true;
  if(g.charAt(0)==='f')return it.f===parseInt(g.slice(2),10);
  if(g.charAt(0)==='d')return it.h===g.slice(2);
  if(g==='o')return !!it.d&&it.d*1000<now()-2*365*DAY;
  return true;
}
function sweepList(){return stage.items.filter(function(i){return matchG(i,ui.sf);});}
function groups(){
  var fc={},dc={},old=0,cut=now()-2*365*DAY,g=[];
  stage.items.forEach(function(i){fc[i.f]=(fc[i.f]||0)+1;dc[i.h]=(dc[i.h]||0)+1;if(i.d&&i.d*1000<cut)old++;});
  Object.keys(fc).filter(function(k){return fc[k]>=3;}).sort(function(a,b){return fc[b]-fc[a];}).slice(0,6).forEach(function(k){g.push({key:'f:'+k,label:'Folder: '+(stage.folders[k]||'No folder'),n:fc[k]});});
  Object.keys(dc).filter(function(k){return dc[k]>=5;}).sort(function(a,b){return dc[b]-dc[a];}).slice(0,6).forEach(function(k){g.push({key:'d:'+k,label:(k.indexOf('YouTube - ')===0?'Channel: '+k.slice(10):'Site: '+k),n:dc[k]});});
  if(old)g.unshift({key:'o',label:'Saved over 2 years ago',n:old});
  return g;
}
function binOne(id){
  var k=stage.items.findIndex(function(i){return i.id===id;});
  if(k<0)return;
  stage.binned.push(stage.items.splice(k,1)[0]);saveStage();render();
}
function binMany(g){
  var keep=[],go=[];
  stage.items.forEach(function(i){(matchG(i,g==='rest'?ui.sf:g)?go:keep).push(i);});
  stage.items=keep;stage.binned=stage.binned.concat(go);
}

/* ---------- clean-up: which Chrome bookmarks are safe to remove ---------- */
/* Safe = a decision is recorded here: kept (open, parked, done, keeper, forever) or binned. Anything still unsorted in the import list is never safe. */
function cleanupSets(){
  var unsorted={},safe={},kept=0,binned=0;
  stage.items.forEach(function(i){unsorted[norm(i.u)]=1;});
  function add(u,kind){
    if(!/^https?:\/\//i.test(u||''))return;
    var k=norm(u);if(unsorted[k]||safe[k])return;
    safe[k]=kind;if(kind==='kept')kept++;else binned++;
  }
  state.items.forEach(function(i){if(i.url)add(i.url,i.status==='binned'?'binned':'kept');});
  stage.binned.forEach(function(i){add(i.u,'binned');});
  return {keys:Object.keys(safe),kept:kept,binned:binned,waiting:stage.items.length};
}
function cleanupBlock(){
  if(isTouch())return '';
  var c=cleanupSets(),h='<h2 class="sec">Remove from Chrome</h2>';
  if(!c.keys.length)return h+'<p class="meta">Nothing is safe to remove yet. A bookmark becomes safe once you have kept it or binned it here. Links still waiting in your sorting list always stay in Chrome.</p>';
  return h+'<p><strong>'+c.keys.length+'</strong> bookmarks are safe to remove from Chrome: '+c.kept+' you kept here and '+c.binned+' you binned. The '+c.waiting+' still waiting to be sorted stay in Chrome.</p>'+
    '<div class="actions"><button class="btn primary" data-a="copy-safe">Copy the safe list</button></div>'+
    (ui.cleanMsg?'<p class="ok" role="status">'+esc(ui.cleanMsg)+'</p>':'')+
    (ui.cleanFallback?'<label for="f-safe">Select all and copy</label><textarea id="f-safe" rows="3" readonly>'+esc(ui.cleanFallback)+'</textarea>':'')+
    '<details><summary class="sum">How to use the Chrome add-on</summary><ol class="steps">'+

    '<li>Tap Copy the safe list above.</li>'+
    '<li>Click the add-on button in Chrome (the donkey, or under the puzzle piece). Paste the list, then follow its three steps. It saves a backup file before it removes anything.</li></ol></details>';
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=el.dataset.id,g=el.dataset.g;
  if(a==='tab'){ui.confirm=null;ui.kp=null;return;}
  if(a==='bm'){e.preventDefault();return;}
  if(a==='bm-copy'){var bk=el.dataset.k;copyText(bmCode(bk),function(ok){ui.copied=ok?bk:'fail:'+bk;render();});return;}
  if(a==='paste-clip'){
    if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(applyPasted).catch(function(){ui.formErr='The browser blocked reading your clipboard. Paste into the Link box instead.';render();});}
    else{ui.formErr='This browser cannot read the clipboard here. Paste into the Link box instead.';render();}
    return;
  }
  if(a.indexOf('imp-')!==0)return;
  if(a!=='imp-binall')ui.confirm=null;
  switch(a){
    case 'imp-sweep':ui.sf=g;ui.kp=null;render();window.scrollTo(0,0);break;
    case 'imp-clearf':ui.sf=null;render();break;
    case 'imp-binall':
      if(ui.confirm!==g){ui.confirm=g;render();break;}
      binMany(g);ui.confirm=null;if(g!=='rest'&&ui.sf===g)ui.sf=null;saveStage();render();break;
    case 'imp-bin':binOne(id);break;
    case 'imp-keep-open':ui.kp=id;ui.focus=true;render();break;
    case 'imp-keep-cancel':ui.kp=null;render();break;
    case 'imp-keep-save':
      var idx=stage.items.findIndex(function(i){return i.id===id;});
      if(idx<0)break;
      var it=stage.items[idx],typ=el.dataset.v,job=(ui.drafts['ikeep:'+id]||'').trim();
      if(!job&&typ==='recipe')job='To cook';
      if(!job){ui.err[id]='Say what it is for, or bin it.';ui.focus=true;render();break;}
      stage.items.splice(idx,1);stage.kept++;
      state.items.push({id:uid(),url:it.u,title:it.t,job:job,type:typ,status:'open',created:now(),touched:now()});
      delete ui.drafts['ikeep:'+id];delete ui.err[id];ui.kp=null;saveStage();commit();autoSortRecent();break;
    case 'imp-restore':
      var k=stage.binned.findIndex(function(i){return i.id===id;});
      if(k>-1){stage.items.push(stage.binned.splice(k,1)[0]);sortStage();saveStage();render();}
      break;
    case 'imp-ytadd':
      var yrows=parsePasted(ui.drafts.ytpaste);
      if(!yrows.length){ui.imp='Nothing to add. Paste what the YouTube bookmark copied.';render();break;}
      ui.drafts.ytpaste='';addRows(yrows);break;
    case 'imp-export':doExport();break;
    case 'imp-restoreall':stage.items=stage.items.concat(stage.binned);stage.binned=[];sortStage();saveStage();render();break;
  }
});

  try{new URL(u);}catch(err){ui.formErr='That does not look like a link.';return render();}
  if(!job&&rec)job='To cook';
  if(!job){ui.formErr='Say what it is for. That is what makes it easy to act on later.';return render();}
  if(state.items.some(function(i){return i.status==='open'&&i.url===u;})){ui.formErr='Already saved and still waiting.';return render();}
  state.items.push({id:uid(),url:u,title:title||niceTitle(u),job:job,type:t,status:st,foreverAt:fa,created:now(),touched:now()});
  ui.drafts.url='';ui.drafts.job='';ui.drafts.title='';
  ui.ok=savedMsg(st);ui.saveForever=false;
  commit();autoSortRecent();
});

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
