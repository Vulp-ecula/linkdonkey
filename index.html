*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:1.0625rem;line-height:1.55}
.wrap{max-width:38rem;margin:0 auto;padding:1.1rem 1.1rem 4rem}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.lockup{display:flex;align-items:center;gap:.6rem}
.mark{width:44px;height:44px;border-radius:10px;background:#fff;border:1.5px solid var(--line);display:block}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;margin:0}
.sync{font-size:.82rem;color:var(--ink-2);margin:0;text-align:right}

.gauge{display:flex;align-items:flex-end;gap:1.1rem;margin:1.4rem 0 .4rem}
.sacks{display:flex;gap:.35rem}
.sack{width:38px;height:42px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-dasharray:3 3}
.sack.on{fill:var(--hay);stroke-dasharray:none}
@media (prefers-reduced-motion: no-preference){.sack{transition:fill .35s ease}}
.gauge h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;letter-spacing:-.02em;margin:0}
.tally{margin:.2rem 0 0;color:var(--ink-2);font-size:.95rem}

nav.tabs{display:flex;flex-wrap:wrap;gap:.25rem 1.3rem;margin:1.2rem 0 1.4rem;border-bottom:1.5px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:4px solid transparent;padding:.7rem 0 .55rem;font-family:var(--display);font-weight:600;font-size:1.02rem;color:var(--ink-2);cursor:pointer;min-height:44px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--hay)}

h2.sec{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:1.6rem 0 .7rem;letter-spacing:-.01em}
.card{background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--hay);border-radius:6px 16px 16px 6px;padding:1rem 1.1rem 1.05rem;margin:0 0 1rem}
.card.recipe{border-left-color:var(--moss)}
.card.recall{border-left-color:var(--ink-2);border-left-style:dotted}
.card h3{font-family:var(--display);font-weight:650;font-size:1.18rem;line-height:1.25;margin:0 0 .3rem;overflow-wrap:anywhere}
.job{margin:0 0 .25rem}
.shot{display:block;max-width:100%;max-height:60vh;border-radius:8px;margin:.5rem 0;background:var(--line)}
.notetext{white-space:pre-wrap;overflow-wrap:anywhere;margin:.4rem 0}
.card.lotd{border-left-color:var(--ink-2)}
.row .notetext{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.row .shot{max-height:14rem}
.lotd-tag{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin:0 0 .3rem;color:var(--ink-2)}
.meta{margin:0 0 .2rem;font-size:.88rem;color:var(--ink-2);overflow-wrap:anywhere}
.stale{margin:.6rem 0 0;padding:.4rem .65rem;border-radius:6px;background:var(--rope-soft);font-size:.92rem}
.ask{margin:.8rem 0 .4rem;font-weight:600}
.note{margin:.6rem 0 0;padding:.1rem 0 .1rem .9rem;border-left:3px solid var(--hay);font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;margin-top:.9rem}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.5rem 1.05rem;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-family:var(--display);font-weight:600;font-size:.98rem;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--hay);border-color:var(--hay);color:var(--on-hay)}
.btn.moss{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.btn.danger{border-color:var(--rope);color:var(--rope)}
.btn.danger.solid{background:var(--rope);color:var(--paper)}
.txt{background:none;border:0;padding:.5rem .3rem;min-height:44px;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2);cursor:pointer}

label{display:block;font-weight:600;margin:1rem 0 .3rem}
.hint{font-weight:400;color:var(--ink-2);font-size:.88rem;display:block}
input[type=url],input[type=text],input[type=search],textarea{width:100%;background:var(--card);border:1.5px solid var(--ink-2);border-radius:8px;padding:.6rem .75rem;min-height:44px}
textarea{resize:vertical}
.seg{display:flex;gap:.5rem;margin:.2rem 0 0}
.seg button{flex:1;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-family:var(--display);font-weight:600;cursor:pointer}
.seg button[aria-checked="true"]{border-color:var(--ink);background:var(--card)}
.err{color:var(--rope);margin:.4rem 0 0;font-size:.92rem}
.ok{margin:.9rem 0 0;padding:.5rem .75rem;border-radius:6px;background:var(--card);border:1.5px solid var(--moss)}
.empty{margin:1.4rem 0;color:var(--ink-2)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0 1rem}
.chips button{min-height:40px;padding:.3rem .9rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-family:var(--display);font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.row{padding:.85rem 0;border-bottom:1.5px solid var(--line)}
.row h3{font-family:var(--display);font-weight:650;font-size:1.05rem;margin:0 0 .15rem;overflow-wrap:anywhere}
.row a{color:inherit}
.row .note{margin-top:.4rem}
ol.steps{padding-left:1.2rem;margin:.4rem 0 1rem}
ol.steps li{margin:.35rem 0}
input[type=file]{width:100%;min-height:44px;padding:.5rem 0}
summary.sum{font-family:var(--display);font-weight:650;font-size:1.05rem;cursor:pointer;padding:.7rem 0;min-height:44px}
details{border-bottom:1.5px solid var(--line);padding-bottom:.6rem}
details[open] summary.sum{margin-bottom:.2rem}
</style>
</head>

<script>
(function(){

function $(s){return document.querySelector(s);}

function clone(o){return JSON.parse(JSON.stringify(o));}

function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function ago(ts){var d=Math.floor((now()-ts)/DAY);if(d<=0)return 'today';if(d===1)return 'yesterday';if(d<30)return d+' days ago';var m=Math.floor(d/30);return m===1?'a month ago':m+' months ago';}
function niceTitle(u){try{var x=new URL(u);var seg=x.pathname.split('/').filter(Boolean).pop()||'';var t=decodeURIComponent(seg).replace(/\.[a-z0-9]+$/i,'').replace(/[-_+]+/g,' ').trim();return t?t.charAt(0).toUpperCase()+t.slice(1):host(u);}catch(e){return host(u);}}

}
async function flush(){
  if(inflight||!dirty)return;

var sb=null,sbUser=null,UID_KEY='linkdonkey.uid';

function startSync(id){

  var s=null;try{var r=await sb.auth.getSession();s=r.data&&r.data.session;}catch(e){}

var imgCache={},imgBusy={},BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function itemBody(it){
  if(it.type==='note')return '<p class="notetext">'+esc(it.text)+'</p>';
  if(it.type==='shot'&&it.img)return '<img class="shot" data-img="'+esc(it.img)+'" alt="'+esc(it.title)+'" src="'+(imgCache[it.img]||BLANK)+'">';
  return '';

function hydrateShots(){
  if(!sb||ui.auth!=='in')return;
  document.querySelectorAll('img[data-img]').forEach(function(im){
    var p=im.getAttribute('data-img');
    if(imgCache[p]){im.src=imgCache[p];return;}
    if(imgBusy[p])return;imgBusy[p]=1;
    sb.storage.from('shots').download(p).then(function(r){
      imgBusy[p]=0;if(r.error||!r.data)return;
      imgCache[p]=URL.createObjectURL(r.data);
      document.querySelectorAll('img[data-img]').forEach(function(x){if(x.getAttribute('data-img')===p)x.src=imgCache[p];});
    },function(){imgBusy[p]=0;});
  });
}
function shrink(f){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,2000/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej();},'image/jpeg',0.85);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej();};
    im.src=url;
  });
}

      '<p class="ask">How was it?</p><div class="actions">'+
      '<button class="btn moss" data-a="cooked-save" data-v="keeper" data-id="'+id+'">Keeper</button>'+
      '<button class="btn" data-a="cooked-save" data-v="once" data-id="'+id+'">Once was enough</button>'+
      '<button class="btn danger" data-a="cooked-save" data-v="never" data-id="'+id+'">Never again</button>'+
      '<button class="txt" data-a="cancel">Cancel</button></div>';
  }else if(it.acting){

      (rec?'<button class="btn moss" data-a="cooked-open" data-id="'+id+'">I cooked it</button>':'<button class="btn primary" data-a="done-open" data-id="'+id+'">Done</button>')+
      '<button class="btn" data-a="notyet" data-id="'+id+'">Not yet</button>'+
      '<button class="btn danger" data-a="bin" data-id="'+id+'">Bin</button></div>';
  }else{
    var stale=isStale(it);
    var binBtn='<button class="btn danger'+(stale?' solid':'')+'" data-a="bin" data-id="'+id+'">Bin</button>';
    var openBtn=isText(it)?'<button class="btn primary" data-a="act" data-id="'+id+'">I used it</button>':'<a class="btn '+(rec?'moss':'primary')+'" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer" data-a="act" data-id="'+id+'">'+(rec?'Open recipe':'Open it')+'</a>';
    var keepBtn='<button class="btn" data-a="keep-open" data-id="'+id+'">Keep</button>';
    var foreverBtn='<button class="txt" data-a="forever" data-id="'+id+'">Keep forever</button>';
    h+='<div class="actions">'+(stale?binBtn+openBtn+keepBtn:openBtn+keepBtn+binBtn)+foreverBtn+'</div>';
  }
  return h+'</article>';
}

/* ---------- Link of the Day (remembered per device, never written into the synced data) ---------- */
var LOTD_KEY='linkdonkey.lotd';
function dayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function lastSeen(i){return Math.max(i.touched||0,i.seen||0,i.clearedAt||0,i.cookedAt||0,i.created||0);}
function lotdGet(){try{var v=JSON.parse(localStorage.getItem(LOTD_KEY)||'null');return v&&typeof v==='object'?v:null;}catch(e){return null;}}
function lotdSave(v){try{localStorage.setItem(LOTD_KEY,JSON.stringify(v));}catch(e){}}
function lotdPool(skip){
  var inWeek={},t=now();
  carried().forEach(function(i){inWeek[i.id]=1;});
  return state.items.filter(function(i){
    if(skip.indexOf(i.id)>-1)return false;
    if(i.status==='open')return !inWeek[i.id]&&(!i.snoozeUntil||i.snoozeUntil<=t);
    return i.status==='keeper'||i.status==='done'||i.status==='forever';
  });
}
function lotdPick(skip){
  var old=function(i){return now()-lastSeen(i)>=3*DAY;};
  var pool=lotdPool(skip||[]);
  /* if anything old exists, only old things qualify; a library with nothing old falls back to whatever is there */
  if(lotdPool([]).some(old))pool=pool.filter(old);
  if(!pool.length)return null;
  var w=pool.map(function(i){return Math.max(1,Math.sqrt((now()-lastSeen(i))/DAY));});
  var r=Math.random()*w.reduce(function(a,b){return a+b;},0);
  for(var k=0;k<pool.length;k++){r-=w[k];if(r<=0)return pool[k];}
  return pool[pool.length-1];
}
function lotdItem(){
  var day=dayKey(),L=lotdGet(),same=L&&L.day===day;
  if(same){
    if(L.id===null)return null;
    var cur=L.id?find(L.id):null;
    if(cur&&cur.status!=='binned')return cur;
  }
  var skip=same?(L.skip||[]):[],p=lotdPick(skip);
  lotdSave({day:day,id:p?p.id:null,skip:skip,seen:false});
  return p;
}
function lotdCard(){
  var it=lotdItem();if(!it)return '';
  var L=lotdGet()||{},id=esc(it.id),isLink=!isText(it),rec=it.type==='recipe';
  var tag=it.status==='forever'?'Keep forever':it.status==='done'?'Finished link':it.status==='keeper'?'Cookbook keeper':kindLabel(it);
  var h='<article class="card lotd"><p class="lotd-tag">Link of the Day</p><h3>'+esc(it.title)+'</h3><p class="job">'+esc(it.job)+'</p>'+itemBody(it)+
    (it.takeaway?'<p class="note">'+esc(it.takeaway)+'</p>':'')+
    '<p class="meta">'+esc(tag)+', last visited '+ago(lastSeen(it))+'</p><div class="actions">';
  if(!L.seen){
    h+=isLink?'<a class="btn primary" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer" data-a="lotd-seen" data-id="'+id+'">'+(rec?'Open recipe':'Open it')+'</a>'
             :'<button class="btn primary" data-a="lotd-seen" data-id="'+id+'">Seen it</button>';
  }else h+='<span class="meta" style="align-self:center">Visited today.</span>';

var SK='linkdonkey.stage.v1',CAP=2000;

function loadStage(){

}

var stageTimer=null,stageOff=false;
function pushStage(){if(!sb||!sbUser||stageOff)return;clearTimeout(stageTimer);stageTimer=setTimeout(doPushStage,800);}
async function doPushStage(){
  if(!sb||!sbUser||stageOff)return;
  clearTimeout(stageTimer);stageTimer=null;
  try{
    var r=await sb.from('ld_stage').upsert({user_id:sbUser,doc:stage,rev:stage.rev||0,updated_at:new Date().toISOString()});
    if(r.error)throw r.error;
    if(ui.stageErr){ui.stageErr=false;if(ui.tab==='import')render();}
  }catch(e){
    if(e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache/i.test(e.message||''))){stageOff=true;return;}
    ui.stageErr=true;if(ui.tab==='import')render();
  }
}
function reconcileStage(){
  var have={};state.items.forEach(function(i){if(i.url)have[norm(i.url)]=1;});
  var n=stage.items.length;
  stage.items=stage.items.filter(function(i){return !have[norm(i.u)];});
  return n!==stage.items.length;
}
async function pullStage(){
  if(!sb||!sbUser||stageOff)return;
  var r;try{r=await sb.from('ld_stage').select('doc').eq('user_id',sbUser).maybeSingle();}catch(e){return;}
  if(r.error){if(r.error.code==='42P01'||r.error.code==='PGRST205'||/does not exist|schema cache/i.test(r.error.message||''))stageOff=true;return;}
  var d=r.data&&r.data.doc;
  if(d&&Array.isArray(d.items)){
    var rr=d.rev||0;
    if(rr>(stage.rev||0)){
      stage={v:1,folders:d.folders||[],items:d.items,binned:d.binned||[],dupes:d.dupes||0,kept:d.kept||0,rev:rr};
      reconcileStage();saveStageLocal();
      ui.sf=null;render();
    }else if(rr<(stage.rev||0)){pushStage();}
  }else if(stage.items.length||stage.binned.length){
    if(!stage.rev){stage.rev=now();saveStageLocal();}
    pushStage();
  }
}

function sortStage(){stage.items.sort(function(a,b){return (a.d||9e9)-(b.d||9e9);});}
function norm(u){
  try{
    var x=new URL(u);x.hash='';
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid'].forEach(function(k){x.searchParams.delete(k);});
    return x.protocol+'//'+x.host.toLowerCase().replace(/^www\./,'')+x.pathname.replace(/\/+$/,'')+x.search;
  }catch(e){return u;}
}
function parseBookmarks(html){
  var doc=new DOMParser().parseFromString(html,'text/html'),out=[];
  doc.querySelectorAll('a[href]').forEach(function(a){
    var href=(a.getAttribute('href')||'').trim();
    if(!/^https?:\/\//i.test(href))return;
    var path=[],dl=a.closest('dl');
    while(dl){
      var dt=dl.parentElement;
      if(dt&&dt.tagName==='DT'){
        for(var c=dt.firstElementChild;c;c=c.nextElementSibling){if(c.tagName==='H3'){path.unshift(c.textContent.trim());break;}}
      }
      dl=(dt&&dt.parentElement)?dt.parentElement.closest('dl'):null;
    }
    out.push({u:href,t:(a.textContent||'').trim(),p:path.join(' / '),d:parseInt(a.getAttribute('add_date')||'0',10)||0});
  });
  return out;
}
function addRows(rows){
  var seen={};
  stage.items.forEach(function(i){seen[norm(i.u)]=1;});
  stage.binned.forEach(function(i){seen[norm(i.u)]=1;});
  state.items.forEach(function(i){seen[norm(i.url)]=1;});
  var added=0,dupes=0,over=0;
  rows.forEach(function(r){
    var k=norm(r.u);
    if(seen[k]){dupes++;return;}
    if(added>=CAP){over++;return;}
    seen[k]=1;
    var pn=r.p||'',fi=stage.folders.indexOf(pn);
    if(fi<0){stage.folders.push(pn);fi=stage.folders.length-1;}
    stage.items.push({id:uid(),u:r.u,t:r.t||niceTitle(r.u),f:fi,d:r.d||0,h:r.h||host(r.u)});
    added++;
  });
  sortStage();stage.dupes+=dupes;
  ui.imp='Added '+added+'. Skipped '+dupes+' duplicates or links you already have.'+(over?' '+over+' more did not fit. Sweep these, then add the rest again.':'');
  ui.sf=null;ui.confirm=null;saveStage();render();
}

function parsePasted(txt){
  txt=(txt||'').trim();
  var rows=[];
  if(!txt)return rows;
  if(txt.charAt(0)==='{'){
    try{
      var o=JSON.parse(txt);
      (o.v||[]).forEach(function(v){
        if(!v||!/^https?:\/\//i.test(v.u||''))return;
        rows.push({u:v.u,t:(v.t||'').trim()||niceTitle(v.u),p:o.p||'YouTube',d:0,h:v.c?'YouTube - '+v.c:host(v.u)});
      });
    }catch(e){}
    return rows;
  }
  txt.split(/\r?\n/).forEach(function(line){
    line=line.trim();
    if(!line)return;
    var m=line.match(/https?:\/\/\S+/),id=line.match(/^([\w-]{11}),/);
    if(m){
      var u=m[0].replace(/[,;]+$/,''),t=line.replace(m[0],'').replace(/^[\s,;-]+|[\s,;-]+$/g,'');
      rows.push({u:u,t:t||niceTitle(u),p:'Pasted',d:0});
    }else if(id){
      rows.push({u:'https://www.youtube.com/watch?v='+id[1],t:'YouTube video '+id[1],p:'Watch later (Takeout)',d:0,h:'youtube.com'});
    }
  });
  return rows;
}
function matchG(it,g){

function groups(){

  stage.items.forEach(function(i){fc[i.f]=(fc[i.f]||0)+1;dc[i.h]=(dc[i.h]||0)+1;if(i.d&&i.d*1000<cut)old++;});

  }

    if(!list.length){say('No videos found on this page. Open a playlist page first.');return;}

      box.textContent='Copy failed. Select all below, copy, then paste in LinkDonkey.';

  else if(k==='wq'){ui.wq=e.target.value;var wl=$('#waiting-list');if(wl){wl.innerHTML=waitingRows();hydrateShots();}}
  else ui.drafts[k]=e.target.value;
});
document.addEventListener('submit',async function(e){
  if(e.target.id!=='saveform')return;
  e.preventDefault();
  var t=ui.saveType,rec=t==='recipe',d=ui.drafts,st=ui.saveForever?'forever':'open',fa=st==='forever'?now():0;
  var job=(d.job||'').trim(),title=(d.title||'').trim();
  ui.ok='';ui.formErr='';
  if(t==='note'){
    var text=(d.note||'').trim();
    if(!text){ui.formErr='Write the note first.';return render();}
    if(!job){ui.formErr='Say what it is for. That is what makes it easy to act on later.';return render();}
    state.items.push({id:uid(),url:'',type:'note',text:text,title:title||firstLine(text),job:job,status:st,foreverAt:fa,created:now(),touched:now()});
    ui.drafts.note='';ui.drafts.job='';ui.drafts.title='';
    ui.ok=savedMsg(st);ui.saveForever=false;
    return commit();
  }
  if(t==='shot'){
    var pics=ui.pics||[],many=pics.length>1;
    if(!pics.length){ui.formErr='Choose a screenshot first.';return render();}
    if(many&&!job)job='Screenshot to sort';
    if(!job){ui.formErr='Say what it is for. That is what makes it easy to act on later.';return render();}
    if(!sb||!sbUser){ui.formErr='Sign in first, then try again.';return render();}
    var day=new Date().toISOString().slice(0,10),done=0,bad=0;
    ui.saving=true;
    for(var i=0;i<pics.length;i++){
      ui.prog='Uploading '+(i+1)+' of '+pics.length;render();
      var id=uid(),path=sbUser+'/'+id+'.jpg',blob,up;
      try{blob=await shrink(pics[i]);up=await sb.storage.from('shots').upload(path,blob,{contentType:'image/jpeg'});}catch(err){up={error:err};}
      if(up.error){bad=pics.length-i;break;}
      imgCache[path]=URL.createObjectURL(blob);
      state.items.push({id:id,url:'',type:'shot',img:path,title:(!many&&title)||('Screenshot '+day+(many?' #'+(i+1):'')),job:job,status:st,foreverAt:fa,created:now(),touched:now()});
      done++;
    }
    ui.saving=false;ui.prog='';
    ui.pics=pics.slice(done);ui.shotUrl=ui.pics.length===1?URL.createObjectURL(ui.pics[0]):'';
    if(bad){
      ui.formErr=(done?'Saved '+done+' of '+pics.length+'. ':'')+'Could not upload the rest. Check your connection, then tap Save again.';
      if(done)commit();else render();
      return;
    }
    ui.drafts.job='';ui.drafts.title='';
    ui.ok=many?'Saved '+done+' screenshots'+(st==='forever'?' to Keep forever.':'.'):savedMsg(st);ui.saveForever=false;
    return commit();
  }
  var u=(d.url||'').trim();
  if(!u){ui.formErr='Paste a link first.';return render();}
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u);}catch(err){ui.formErr='That does not look like a link.';return render();}
  if(!job&&rec)job='To cook';
  if(!job){ui.formErr='Say what it is for. That is what makes it easy to act on later.';return render();}
  if(state.items.some(function(i){return i.status==='open'&&i.url===u;})){ui.formErr='Already saved and still waiting.';return render();}
  state.items.push({id:uid(),url:u,title:title||niceTitle(u),job:job,type:t,status:st,foreverAt:fa,created:now(),touched:now()});
  ui.drafts.url='';ui.drafts.job='';ui.drafts.title='';
  ui.ok=savedMsg(st);ui.saveForever=false;
  commit();
});

loadLocal();
checkSize();
loadStage();
prefillFromUrl();
render();
initRemote();
dl={save:function(o){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.data],{type:'text/html'}));a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);return Promise.resolve();}};
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
